# jeromebadour.com: every request goes to the site's container on 127.0.0.1:3102 (compose.yaml in
# /srv/jeromebadour/app). Included from /etc/nginx/sites-enabled/jeromebadour, inside its server block.
# Installed to /etc/nginx/snippets/.

client_max_body_size 64k;
access_log /var/log/nginx/jeromebadour.access.log jeromebadour;

# One address: www goes to the root. The check sits inside the locations, not at server level, so certbot's own
# exact-match challenge location for www still answers (a server-level return would redirect the challenge too).
location / {
    if ($host = www.jeromebadour.com) {
        return 301 https://jeromebadour.com$request_uri;
    }
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Always the real address, replacing anything the visitor sent: the per-visitor limits count on it.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

# Ask streams its answer line by line (stages, then each point): no buffering, so they arrive as they happen.
location = /api/ask {
    if ($host = www.jeromebadour.com) {
        return 301 https://jeromebadour.com$request_uri;
    }
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
}
